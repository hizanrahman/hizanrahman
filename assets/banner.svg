<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Hizan Rahman — Build. Inspect. Repeat.</title>
  <desc id="desc">A black and yellow developer workbench banner, with a code window connecting development and security.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#25282c" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="440" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="440" fill="#0d1015"/>
    <rect x="724" width="476" height="440" fill="url(#grid)"/>
    <path d="M724 0V440" stroke="#343434"/>
    <rect x="0" width="8" height="440" fill="#facc15"/>

    <g font-family="Consolas, 'Courier New', monospace">
      <rect x="48" y="35" width="160" height="28" rx="4" fill="#facc15"/>
      <text x="63" y="54" font-size="13" font-weight="700" letter-spacing="1.4" fill="#0d1015">HIZAN / GITHUB</text>
      <text x="232" y="54" font-size="13" letter-spacing="2" fill="#b8bec9">THE WORKBENCH</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-4">
      <text x="45" y="155" font-size="88" fill="#f6f5ee">HIZAN</text>
      <text x="43" y="240" font-size="88" fill="#f6f5ee">RAHMAN<tspan fill="#facc15">.</tspan></text>
    </g>

    <path d="M49 270H672" stroke="#34373d"/>
    <text x="48" y="316" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.8" fill="#facc15">Build. Inspect. Repeat.</text>
    <text x="49" y="354" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#bcc2cc">DEVELOPER / SECURITY</text>
    <text x="49" y="404" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8e99a8">@hizanrahman</text>
    <g transform="translate(638 385)">
      <path d="M0 18L18 0M3 0H18V15" stroke="#facc15" stroke-width="2.5" fill="none"/>
    </g>

    <rect x="760" y="58" width="402" height="319" rx="9" fill="#161b22" stroke="#414752"/>
    <path d="M760 99H1162" stroke="#414752"/>
    <circle cx="780" cy="79" r="4" fill="#f87171"/>
    <circle cx="796" cy="79" r="4" fill="#facc15"/>
    <circle cx="812" cy="79" r="4" fill="#64748b"/>
    <text x="840" y="83" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#bcc2cc">~/hizan/workbench</text>

    <g font-family="Consolas, 'Courier New', monospace">
      <text x="783" y="135" font-size="15" fill="#facc15">$ explore --with-curiosity</text>
      <text x="783" y="169" font-size="14" fill="#f6f5ee">01</text>
      <text x="819" y="169" font-size="14" fill="#b8bec9">build the interface</text>
      <text x="783" y="198" font-size="14" fill="#f6f5ee">02</text>
      <text x="819" y="198" font-size="14" fill="#b8bec9">understand the system</text>
      <text x="783" y="227" font-size="14" fill="#f6f5ee">03</text>
      <text x="819" y="227" font-size="14" fill="#b8bec9">test the assumptions</text>
      <text x="783" y="256" font-size="14" fill="#f6f5ee">04</text>
      <text x="819" y="256" font-size="14" fill="#b8bec9">share what you learn</text>
      <path d="M783 280H1139" stroke="#343b46"/>
      <text x="783" y="309" font-size="13" fill="#9da8b7">// small experiments.</text>
      <text x="783" y="332" font-size="13" fill="#9da8b7">// better questions.</text>
      <text x="783" y="356" font-size="15" fill="#facc15">&gt;</text>
      <rect x="802" y="344" width="8" height="14" fill="#facc15"/>
    </g>
    <rect x="1100" y="398" width="14" height="14" fill="#f87171"/>
    <rect x="1124" y="398" width="14" height="14" fill="#facc15"/>
    <rect x="1148" y="398" width="14" height="14" fill="#f6f5ee"/>
  </g>
</svg>
